<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#9d4edd" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="100" height="100" rx="24" fill="url(#bgGrad)" stroke="url(#primaryGlow)" stroke-width="2"/>
  <polygon points="50,15 82,33 82,67 50,85 18,67 18,33" fill="none" stroke="url(#primaryGlow)" stroke-width="3.5" filter="url(#glow)"/>
  <text x="50" y="58" font-family="'Space Grotesk', 'Segoe UI', sans-serif" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">BJ</text>
  <circle cx="50" cy="85" r="3" fill="#00f2fe" filter="url(#glow)"/>
</svg>
